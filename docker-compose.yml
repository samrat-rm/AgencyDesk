services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agencydesk
      POSTGRES_PASSWORD: agencydesk
      POSTGRES_DB: agencydesk
    ports:
      # 5433 on the host so it never clashes with a Postgres you already run locally.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencydesk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
